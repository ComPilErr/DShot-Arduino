[env:atmega328pb]
platform = atmelavr
board = ATmega328PB
framework = arduino

board_build.mcu = atmega328pb

board_build.f_cpu = 16000000L

upload_protocol = custom

upload_command = /usr/bin/avrdude -p m328pb -c ft232h -P usb -U flash:w:$SOURCE:i

lib_deps = mikem/RadioHead

platform_packages =
    toolchain-atmelavr@~1.70300.0